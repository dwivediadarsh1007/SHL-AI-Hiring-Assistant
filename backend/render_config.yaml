services:
  - type: web
    name: shl-recommender
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        scope: run
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
